{% extends "base.html" %}
{% block content %}
<h1 class="text-2xl font-semibold mb-6">Настройки уведомлений</h1>
<form method="post" action="/admin/notifications" class="bg-white border border-slate-200 rounded-lg p-4 mb-6 grid md:grid-cols-5 gap-3 items-end">
  <label class="text-sm"><span class="text-slate-600">Тип события</span><select name="event_type" class="mt-1 w-full border rounded px-3 py-2">{% for event_type in event_types %}<option value="{{ event_type.value }}">{{ event_type.value }}</option>{% endfor %}</select></label>
  <label class="text-sm"><span class="text-slate-600">Значение</span><input name="amount" type="number" min="1" value="1" class="mt-1 w-full border rounded px-3 py-2"></label>
  <label class="text-sm"><span class="text-slate-600">Единица</span><select name="unit" class="mt-1 w-full border rounded px-3 py-2"><option value="minutes">минуты</option><option value="hours">часы</option><option value="days">дни</option></select></label>
  <label class="text-sm flex gap-2 items-center"><input name="enabled" type="checkbox" value="true" checked> Включено</label>
  <button class="bg-slate-900 text-white rounded px-3 py-2 text-sm">Добавить</button>
</form>
<div class="bg-white border border-slate-200 rounded-lg overflow-hidden">
  <table class="w-full text-sm">
    <thead class="bg-slate-100 text-slate-600"><tr><th class="p-3 text-left">Тип</th><th class="p-3">Когда</th><th class="p-3">Статус</th><th></th></tr></thead>
    <tbody>
      {% for row in settings_rows %}
      <tr class="border-t border-slate-100"><td class="p-3">{{ row.event_type.value }}</td><td class="p-3 text-center">за {{ row.amount }} {{ row.unit }}</td><td class="p-3 text-center">{{ "вкл" if row.enabled else "выкл" }}</td><td class="p-3 text-right"><form method="post" action="/admin/notifications/{{ row.id }}/delete"><button class="text-red-700">Удалить</button></form></td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
