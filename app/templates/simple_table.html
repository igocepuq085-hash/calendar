{% extends "base.html" %}
{% block content %}
<h1 class="text-2xl font-semibold mb-6">{{ title }}</h1>
<div class="bg-white border border-slate-200 rounded-lg overflow-hidden">
  <table class="w-full text-sm">
    <thead class="bg-slate-100 text-slate-600"><tr>{% for header in headers %}<th class="p-3 text-left">{{ header }}</th>{% endfor %}</tr></thead>
    <tbody>{% for row in rows %}<tr class="border-t border-slate-100">{% for cell in row %}<td class="p-3">{{ cell }}</td>{% endfor %}</tr>{% else %}<tr><td class="p-3 text-slate-500" colspan="{{ headers|length }}">Нет данных</td></tr>{% endfor %}</tbody>
  </table>
</div>
{% endblock %}
